[project]
name = "qtaggerplus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pennylane>=0.45.1",
    "qiskit>=2.4.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "wandb>=0.28.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/classical"]
